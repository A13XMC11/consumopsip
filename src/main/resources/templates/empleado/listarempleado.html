<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Empleados | Asistencia</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-people"></i></span>
				<div>
					<p class="eyebrow mb-1">Gestión</p>
					<h1 class="h3 mb-1">Empleados</h1>
					<p class="text-muted mb-0">Empleados registrados en el sistema.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/empleado/nuevo}">
					<i class="bi bi-person-plus"></i> Nuevo Empleado
				</a>
			</div>
		</div>
		<section class="panel mt-3">
			<div class="panel-header">
				<div>
					<h2 class="h5 mb-1 section-title">
						<i class="bi bi-table"></i><span>Lista de Empleados</span>
					</h2>
					<p class="text-muted mb-0">Revisa y gestiona los empleados
						registrados.</p>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table align-middle mb-0">
					<thead>
						<tr>
							<th>#</th>
							<th>Nombre</th>
							<th>Apellidos</th>
							<th>Correo</th>
							<th>ID Rol</th>
							<th>Estado</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice : ${listaempleados}">
							<td th:text="${indice.idEmpleado}"></td>
							<td th:text="${indice.nombreEmpleado}"></td>
							<td th:text="${indice.apellidosEmpleado}"></td>
							<td th:text="${indice.correoEmpleado}"></td>
							<td th:text="${indice.idRol}"></td>
							<td><span th:if="${indice.estadoEmpleado}"
								class="badge text-bg-success">Activo</span> <span
								th:unless="${indice.estadoEmpleado}"
								class="badge text-bg-secondary">Inactivo</span></td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
