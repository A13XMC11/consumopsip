<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head><title>Ubicaciones | Asistencia</title></head>
<body>
  <div layout:fragment="cargarpaginas">
    <div class="page-heading">
      <div class="page-heading-copy">
        <span class="page-icon"><i class="bi bi-geo-alt"></i></span>
        <div>
          <p class="eyebrow mb-1">Gestión</p>
          <h1 class="h3 mb-1">Ubicaciones</h1>
          <div th:if="${error}" class="alert alert-danger mt-2" th:text="${error}"></div>
          <p class="text-muted mb-0">Puntos de marcación registrados.</p>
        </div>
      </div>
      <div class="heading-actions">
        <a class="btn btn-primary btn-sm" th:href="@{/ubicacion/nuevo}">
          <i class="bi bi-plus-lg"></i> Nueva Ubicación
        </a>
      </div>
    </div>
    <section class="panel mt-3">
      <div class="panel-header">
        <div>
          <h2 class="h5 mb-1 section-title"><i class="bi bi-table"></i><span>Lista de Ubicaciones</span></h2>
          <p class="text-muted mb-0">Coordenadas y radios de alcance.</p>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>#</th><th>Nombre</th><th>Latitud</th>
              <th>Longitud</th><th>Radio (m)</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="indice : ${listaubicaciones}">
              <td th:text="${indice.idUbicacion}"></td>
              <td th:text="${indice.nombreUbicacion}"></td>
              <td th:text="${indice.latitudUbicacion}"></td>
              <td th:text="${indice.longitudUbicacion}"></td>
              <td th:text="${indice.radioMetrosUbicacion}"></td>
              <td>
                <span th:if="${indice.estadoUbicacion}" class="badge text-bg-success">Activa</span>
                <span th:unless="${indice.estadoUbicacion}" class="badge text-bg-secondary">Inactiva</span>
              </td>
            <td>
              <a th:href="@{/ubicacion/editar/{id}(id=${indice.idUbicacion})}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i></a>
              <a th:href="@{/ubicacion/desactivar/{id}(id=${indice.idUbicacion})}" class="btn btn-light btn-sm" onclick="return confirm('¿Desactivar esta ubicación?')"><i class="bi bi-slash-circle"></i></a>
            </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</body>
</html>
