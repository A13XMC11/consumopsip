<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head><title>Nueva Ubicación | Asistencia</title></head>
<body>
  <div layout:fragment="cargarpaginas">
    <div class="page-heading">
      <div class="page-heading-copy">
        <span class="page-icon"><i class="bi bi-geo-alt-fill"></i></span>
        <div>
          <p class="eyebrow mb-1">Gestión</p>
          <h1 class="h3 mb-1">Nueva Ubicación</h1>
          <p class="text-muted mb-0">Registra un punto de marcación.</p>
        </div>
      </div>
      <div class="heading-actions">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/ubicacion}">
          <i class="bi bi-arrow-left"></i> Volver
        </a>
      </div>
    </div>
    <section class="row g-3">
      <div class="col-12 col-xl-8">
        <form class="panel" th:action="@{/ubicacion/guardar}" th:object="${ubicacion}" method="post">
          <input type="hidden" th:field="*{idUbicacion}">
          <div class="panel-header">
            <div><h2 class="h5 mb-1 section-title"><i class="bi bi-geo-alt-fill"></i><span>Datos de la Ubicación</span></h2></div>
          </div>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Nombre</label>
              <input class="form-control" type="text" th:field="*{nombreUbicacion}">
            </div>
            <div class="col-12">
              <span id="ubicacionActualEstado" class="text-muted small"></span>
            </div>
            <div class="col-md-6">
              <label class="form-label">Latitud</label>
              <input class="form-control" type="number" step="any" id="latitudUbicacion" th:field="*{latitudUbicacion}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Longitud</label>
              <input class="form-control" type="number" step="any" id="longitudUbicacion" th:field="*{longitudUbicacion}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Radio (metros)</label>
              <input class="form-control" type="number" step="any" th:field="*{radioMetrosUbicacion}">
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" th:field="*{estadoUbicacion}">
                <label class="form-check-label">Activa</label>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/ubicacion}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Guardar</button>
          </div>
        </form>
      </div>
    </section>
    <script>
      (function () {
        var estado = document.getElementById('ubicacionActualEstado');
        var latInput = document.getElementById('latitudUbicacion');
        var lngInput = document.getElementById('longitudUbicacion');

        function tieneValor(valor) {
          var numero = parseFloat(valor);
          return valor !== '' && !isNaN(numero) && numero !== 0;
        }

        if (tieneValor(latInput.value) || tieneValor(lngInput.value)) {
          return;
        }

        if (!navigator.geolocation) {
          estado.textContent = 'Tu navegador no soporta geolocalización.';
          return;
        }

        estado.textContent = 'Obteniendo tu ubicación...';
        navigator.geolocation.getCurrentPosition(
          function (position) {
            latInput.value = position.coords.latitude.toFixed(6);
            lngInput.value = position.coords.longitude.toFixed(6);
            estado.textContent = 'Ubicación capturada automáticamente (precisión ±' + Math.round(position.coords.accuracy) + ' m).';
          },
          function (error) {
            var mensajes = {
              1: 'Permiso de ubicación denegado. Ingresa las coordenadas manualmente.',
              2: 'No se pudo determinar tu ubicación. Ingresa las coordenadas manualmente.',
              3: 'Tiempo de espera agotado al obtener la ubicación. Ingresa las coordenadas manualmente.'
            };
            estado.textContent = mensajes[error.code] || 'Error al obtener la ubicación.';
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      })();
    </script>
  </div>
</body>
</html>
