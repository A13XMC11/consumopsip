<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head><title>Códigos Temporales | Asistencia</title></head>
<body>
  <div layout:fragment="cargarpaginas">
    <div class="page-heading">
      <div class="page-heading-copy">
        <span class="page-icon"><i class="bi bi-key"></i></span>
        <div>
          <p class="eyebrow mb-1">Gestión</p>
          <h1 class="h3 mb-1">Códigos Temporales</h1>
          <p class="text-muted mb-0">Códigos de acceso generados.</p>
        </div>
      </div>
      <div class="heading-actions">
        <a class="btn btn-primary btn-sm" th:href="@{/codigostemporales/nuevo}">
          <i class="bi bi-plus-lg"></i> Nuevo Código
        </a>
      </div>
    </div>
    <section class="panel mt-3">
      <div class="panel-header">
        <div>
          <h2 class="h5 mb-1 section-title"><i class="bi bi-table"></i><span>Lista de Códigos</span></h2>
          <p class="text-muted mb-0">Códigos generados y su estado.</p>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>#</th><th>Empleado</th><th>Código</th>
              <th>Tipo</th><th>Generado</th><th>Expira</th><th>Usado</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="indice : ${listacodigos}">
              <td th:text="${indice.idCodigo}"></td>
              <td th:text="${mapaEmpleados[indice.idEmpleado]}"></td>
              <td th:text="${indice.codigo}"></td>
              <td th:text="${indice.tipo}"></td>
              <td th:text="${indice.generadoEn}"></td>
              <td th:text="${indice.expiraEn}"></td>
              <td>
                <span th:if="${indice.usado}" class="badge text-bg-secondary">Sí</span>
                <span th:unless="${indice.usado}" class="badge text-bg-success">No</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</body>
</html>
