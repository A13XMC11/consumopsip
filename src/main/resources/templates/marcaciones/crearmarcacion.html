<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/plantilla/plantillaui">
<head><title>Nueva Marcación | Asistencia</title></head>
<body>
  <div layout:fragment="cargarpaginas">
    <div class="page-heading">
      <div class="page-heading-copy">
        <span class="page-icon"><i class="bi bi-fingerprint"></i></span>
        <div>
          <p class="eyebrow mb-1">Registro</p>
          <h1 class="h3 mb-1">Nueva Marcación</h1>
          <p class="text-muted mb-0">Registra una entrada o salida.</p>
        </div>
      </div>
      <div class="heading-actions">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/marcaciones}">
          <i class="bi bi-arrow-left"></i> Volver
        </a>
      </div>
    </div>
    <section class="row g-3">
      <div class="col-12 col-xl-8">
        <form class="panel" th:action="@{/marcaciones/guardar}" th:object="${marcacion}" method="post">
          <div class="panel-header">
            <div><h2 class="h5 mb-1 section-title"><i class="bi bi-fingerprint"></i><span>Datos de la Marcación</span></h2></div>
          </div>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">ID Empleado</label><input class="form-control" type="number" th:field="*{idEmpleado}"></div>
            <div class="col-md-6"><label class="form-label">ID Código</label><input class="form-control" type="number" th:field="*{idCodigo}"></div>
            <div class="col-md-6"><label class="form-label">ID Ubicación</label><input class="form-control" type="number" th:field="*{idUbicacion}"></div>
            <div class="col-md-6"><label class="form-label">Tipo</label><input class="form-control" type="text" th:field="*{tipo}"></div>
            <div class="col-md-6"><label class="form-label">Fecha</label><input class="form-control" type="date" th:field="*{fechaMarcacion}"></div>
            <div class="col-md-6"><label class="form-label">Hora</label><input class="form-control" type="time" th:field="*{horaMarcacion}"></div>
            <div class="col-md-6"><label class="form-label">Latitud</label><input class="form-control" type="number" step="any" th:field="*{latitud}"></div>
            <div class="col-md-6"><label class="form-label">Longitud</label><input class="form-control" type="number" step="any" th:field="*{longitud}"></div>
            <div class="col-12"><label class="form-label">Observación</label><input class="form-control" type="text" th:field="*{observacion}"></div>
            <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{dentroRango}"><label class="form-check-label">Dentro de Rango</label></div></div>
            <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{dentroHorario}"><label class="form-check-label">Dentro de Horario</label></div></div>
            <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{valida}"><label class="form-check-label">Válida</label></div></div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/marcaciones}">Cancelar</a>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Guardar</button>
          </div>
        </form>
      </div>
    </section>
  </div>
</body>
</html>
