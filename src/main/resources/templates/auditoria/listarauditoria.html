<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Auditoría | Asistencia</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-journal-text"></i></span>
				<div>
					<p class="eyebrow mb-1">Asistencia</p>
					<h1 class="h3 mb-1">Auditoría</h1>
					<p class="text-muted mb-0">Registros de auditoría del sistema.</p>
				</div>
			</div>
		</div>
		<section class="panel mt-3">
			<div class="panel-header">
				<div>
					<h2 class="h5 mb-1 section-title">
						<i class="bi bi-table"></i><span>Lista de Auditorías</span>
					</h2>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table align-middle mb-0">
					<thead>
						<tr>
							<th>#</th>
							<th>Empleado</th>
							<th>Acción</th>
							<th>Tabla</th>
							<th>Detalle</th>
							<th>IP</th>
							<th>Fecha y Hora</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice : ${listaauditorias}">
							<td th:text="${indice.idAuditoria}"></td>
							<td th:text="${mapaEmpleados[indice.idEmpleado]}"></td>
							<td th:text="${indice.accion}"></td>
							<td th:text="${indice.tablaAfectada}"></td>
							<td th:text="${indice.detalle}"></td>
							<td th:text="${indice.ip}"></td>
							<td th:text="${indice.fechaHora}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
