<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Auditoría | UISRAEL</title>
<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <main class="dashboard-content">
            <div class="container-fluid px-3 px-lg-4 py-4">
                <div class="page-heading">
                    <div class="page-heading-copy">
                        <span class="page-icon"><i class="bi bi-journal-text"></i></span>
                        <div>
                            <p class="eyebrow mb-1">Asistencia</p>
                            <h1 class="h3 mb-1">Auditoría</h1>
                        </div>
                    </div>
                    <div class="page-heading-actions">
                        <a href="/auditoria/nuevo" class="btn btn-primary">
                            <i class="bi bi-plus-lg me-1"></i> Nueva Auditoría
                        </a>
                    </div>
                </div>
                <section class="panel">
                    <div class="panel-header">
                        <div>
                            <h2 class="h5 mb-1 section-title"><i class="bi bi-table"></i> Lista de Auditorías</h2>
                            <p class="text-muted mb-0">Registros de auditoría del sistema.</p>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>ID Empleado</th>
                                    <th>Acción</th>
                                    <th>Tabla</th>
                                    <th>Detalle</th>
                                    <th>IP</th>
                                    <th>Fecha y Hora</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="indice : ${listaauditorias}">
                                    <td th:text="${indice.idAuditoria}"></td>
                                    <td th:text="${indice.idEmpleado}"></td>
                                    <td th:text="${indice.accion}"></td>
                                    <td th:text="${indice.tablaAfectada}"></td>
                                    <td th:text="${indice.detalle}"></td>
                                    <td th:text="${indice.ip}"></td>
                                    <td th:text="${indice.fechaHora}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
