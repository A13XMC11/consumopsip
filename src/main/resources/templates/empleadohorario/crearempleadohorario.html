<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Nueva Asignación | Asistencia</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-calendar-check"></i></span>
				<div>
					<p class="eyebrow mb-1">Gestión</p>
					<h1 class="h3 mb-1">Nueva Asignación de Horario</h1>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-outline-secondary btn-sm" th:href="@{/empleadohorario}">
					<i class="bi bi-arrow-left"></i> Volver
				</a>
			</div>
		</div>
		<section class="row g-3">
			<div class="col-12 col-xl-8">
				<form class="panel" th:action="@{/empleadohorario/guardar}" th:object="${empleadohorario}" method="post">
					<div class="panel-header">
						<div>
							<h2 class="h5 mb-1 section-title">
								<i class="bi bi-calendar-check"></i><span>Datos de la Asignación</span>
							</h2>
						</div>
					</div>
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">ID Empleado</label>
							<input class="form-control" type="number" th:field="*{idEmpleado}">
						</div>
						<div class="col-md-6">
							<label class="form-label">ID Horario</label>
							<input class="form-control" type="number" th:field="*{idHorario}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha Inicio</label>
							<input class="form-control" type="date" th:field="*{fechaInicio}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha Fin</label>
							<input class="form-control" type="date" th:field="*{fechaFin}">
						</div>
						<div class="col-12">
							<div class="form-check">
								<input class="form-check-input" type="checkbox" th:field="*{estadoEmpleadoHorario}">
								<label class="form-check-label">Activo</label>
							</div>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-outline-secondary" th:href="@{/empleadohorario}">Cancelar</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check-lg"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
