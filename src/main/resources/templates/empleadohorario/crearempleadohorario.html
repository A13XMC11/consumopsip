<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Nueva Asignación | Asistencia</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-calendar-check"></i></span>
				<div>
					<p class="eyebrow mb-1">Gestión</p>
					<h1 class="h3 mb-1">Nueva Asignación de Horario</h1>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-outline-secondary btn-sm"
					th:href="@{/empleadohorario}"> <i class="bi bi-arrow-left"></i>
					Volver
				</a>
			</div>
		</div>
		<section class="row g-3">
			<div class="col-12 col-xl-8">
				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
				<form class="panel" id="formEmpleadoHorario" th:action="@{/empleadohorario/guardar}"
					th:object="${empleadohorario}" method="post">
					<input type="hidden" th:field="*{idAsignacion}">
					<input type="hidden" id="forzarReemplazo" th:field="*{forzarReemplazo}">
					<div class="panel-header">
						<div>
							<h2 class="h5 mb-1 section-title">
								<i class="bi bi-calendar-check"></i><span>Datos de la
									Asignación</span>
							</h2>
						</div>
					</div>
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Empleado</label> <select
								class="form-select" th:field="*{idEmpleado}">
								<option th:each="e : ${listaempleados}"
									th:value="${e.idEmpleado}"
									th:text="${e.nombreEmpleado + ' ' + e.apellidosEmpleado}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Horario</label> <select
								class="form-select" th:field="*{idHorario}">
								<option th:each="h : ${listahorarios}" th:value="${h.idHorario}"
									th:text="${h.nombre}"></option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha Inicio</label> <input
								class="form-control" type="date" th:field="*{fechaInicio}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha Fin</label> <input
								class="form-control" type="date" th:field="*{fechaFin}">
						</div>
						<div class="col-12">
							<div class="form-check">
								<input class="form-check-input" type="checkbox"
									th:field="*{estadoEmpleadoHorario}"> <label
									class="form-check-label">Activo</label>
							</div>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-outline-secondary" th:href="@{/empleadohorario}">Cancelar</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check-lg"></i> Guardar
						</button>
					</div>
				</form>

				<div th:if="${conflictoHorario}" class="modal fade" id="modalConflictoHorario"
					tabindex="-1" aria-hidden="true">
					<div class="modal-dialog">
						<div class="modal-content">
							<div class="modal-header">
								<h5 class="modal-title">
									<i class="bi bi-exclamation-triangle text-warning"></i>
									Horario ya asignado
								</h5>
								<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
							</div>
							<div class="modal-body">
								<p th:text="${conflictoMensaje}"></p>
								<p>¿Deseas reemplazar el horario actual del empleado por el nuevo?</p>
							</div>
							<div class="modal-footer">
								<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
								<button type="button" class="btn btn-warning" id="btnReemplazarHorario">
									<i class="bi bi-arrow-repeat"></i> Reemplazar horario
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<th:block th:if="${conflictoHorario}">
			<script th:inline="javascript">
				document.addEventListener('DOMContentLoaded', function () {
					var modal = new bootstrap.Modal(document.getElementById('modalConflictoHorario'));
					modal.show();
					document.getElementById('btnReemplazarHorario').addEventListener('click', function () {
						document.getElementById('forzarReemplazo').value = 'true';
						document.getElementById('formEmpleadoHorario').submit();
					});
				});
			</script>
		</th:block>
	</div>
</body>
</html>
