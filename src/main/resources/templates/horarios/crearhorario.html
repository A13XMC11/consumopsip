<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Nuevo Horario | Asistencia</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-clock"></i></span>
				<div>
					<p class="eyebrow mb-1">Gestión</p>
					<h1 class="h3 mb-1">Nuevo Horario</h1>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-outline-secondary btn-sm" th:href="@{/horarios}">
					<i class="bi bi-arrow-left"></i> Volver
				</a>
			</div>
		</div>
		<section class="row g-3">
			<div class="col-12 col-xl-8">
				<form class="panel" th:action="@{/horarios/guardar}" th:object="${horario}" method="post">
					<input type="hidden" th:field="*{idHorario}">
					<div class="panel-header">
						<div>
							<h2 class="h5 mb-1 section-title">
								<i class="bi bi-clock"></i><span>Datos del Horario</span>
							</h2>
						</div>
					</div>
					<div class="row g-3">
						<div class="col-12">
							<label class="form-label">Nombre</label>
							<input class="form-control" type="text" th:field="*{nombre}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Hora Entrada</label>
							<input class="form-control" type="time" th:field="*{horaEntrada}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Hora Salida</label>
							<input class="form-control" type="time" th:field="*{horaSalida}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Tolerancia (minutos)</label>
							<input class="form-control" type="number" th:field="*{toleranciaMinutos}">
						</div>
						<div class="col-md-6 d-flex align-items-end">
							<div class="form-check mb-2">
								<input class="form-check-input" type="checkbox" th:field="*{estadoHorario}">
								<label class="form-check-label">Activo</label>
							</div>
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-outline-secondary" th:href="@{/horarios}">Cancelar</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check-lg"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
