<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Nuevo Reporte Diario | UISRAEL</title>
<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <main class="dashboard-content">
            <div class="container-fluid px-3 px-lg-4 py-4">
                <div class="page-heading">
                    <div class="page-heading-copy">
                        <span class="page-icon"><i class="bi bi-clipboard-plus"></i></span>
                        <div>
                            <p class="eyebrow mb-1">Asistencia</p>
                            <h1 class="h3 mb-1">Nuevo Reporte Diario</h1>
                        </div>
                    </div>
                    <div class="page-heading-actions">
                        <a href="/reportediario" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Volver
                        </a>
                    </div>
                </div>
                <section class="panel">
                    <div class="panel-header">
                        <div>
                            <h2 class="h5 mb-1 section-title"><i class="bi bi-pencil-square"></i> Datos del Reporte</h2>
                            <p class="text-muted mb-0">Complete los campos para registrar un nuevo reporte diario.</p>
                        </div>
                    </div>
                    <div class="p-4">
                        <form th:action="@{/reportediario/guardar}" th:object="${reporte}" method="post">
                            <div class="mb-3">
                                <label for="idEmpleado" class="form-label">ID Empleado</label>
                                <input type="number" th:field="*{idEmpleado}" class="form-control" id="idEmpleado">
                            </div>
                            <div class="mb-3">
                                <label for="fechaReporte" class="form-label">Fecha</label>
                                <input type="date" th:field="*{fechaReporte}" class="form-control" id="fechaReporte">
                            </div>
                            <div class="mb-3">
                                <label for="horaEntrada" class="form-label">Hora de Entrada</label>
                                <input type="time" th:field="*{horaEntrada}" class="form-control" id="horaEntrada">
                            </div>
                            <div class="mb-3">
                                <label for="horaSalida" class="form-label">Hora de Salida</label>
                                <input type="time" th:field="*{horaSalida}" class="form-control" id="horaSalida">
                            </div>
                            <div class="mb-3">
                                <label for="minutosTardanza" class="form-label">Minutos de Tardanza</label>
                                <input type="number" th:field="*{minutosTardanza}" class="form-control" id="minutosTardanza">
                            </div>
                            <div class="mb-2">
                                <div class="form-check">
                                    <input type="checkbox" th:field="*{tardanzaReporte}" class="form-check-input" id="tardanzaReporte">
                                    <label class="form-check-label" for="tardanzaReporte">Tardanza</label>
                                </div>
                            </div>
                            <div class="mb-4">
                                <div class="form-check">
                                    <input type="checkbox" th:field="*{marcacionIncompleta}" class="form-check-input" id="marcacionIncompleta">
                                    <label class="form-check-label" for="marcacionIncompleta">Marcación Incompleta</label>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i> Guardar
                            </button>
                            <a href="/reportediario" class="btn btn-outline-secondary ms-2">Cancelar</a>
                        </form>
                    </div>
                </section>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
