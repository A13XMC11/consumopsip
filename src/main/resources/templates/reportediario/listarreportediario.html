<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Reporte Diario | Asistencia</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-clipboard-data"></i></span>
				<div>
					<p class="eyebrow mb-1">Asistencia</p>
					<h1 class="h3 mb-1">Reporte Diario</h1>
					<p class="text-muted mb-0">Reportes diarios generados
						automáticamente por el sistema.</p>
				</div>
			</div>
		</div>
		<section class="panel mt-3">
			<div class="panel-header">
				<div>
					<h2 class="h5 mb-1 section-title">
						<i class="bi bi-table"></i><span>Lista de Reportes Diarios</span>
					</h2>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table align-middle mb-0">
					<thead>
						<tr>
							<th>#</th>
							<th>ID Empleado</th>
							<th>Fecha</th>
							<th>Hora Entrada</th>
							<th>Hora Salida</th>
							<th>Tardanza</th>
							<th>Min. Tardanza</th>
							<th>Incompleta</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice : ${listareportes}">
							<td th:text="${indice.idReporte}"></td>
							<td th:text="${indice.idEmpleado}"></td>
							<td th:text="${indice.fechaReporte}"></td>
							<td th:text="${indice.horaEntrada}"></td>
							<td th:text="${indice.horaSalida}"></td>
							<td><span th:if="${indice.tardanzaReporte}"
								class="badge text-bg-warning">Sí</span> <span
								th:unless="${indice.tardanzaReporte}"
								class="badge text-bg-success">No</span></td>
							<td th:text="${indice.minutosTardanza}"></td>
							<td><span th:if="${indice.marcacionIncompleta}"
								class="badge text-bg-danger">Sí</span> <span
								th:unless="${indice.marcacionIncompleta}"
								class="badge text-bg-success">No</span></td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
