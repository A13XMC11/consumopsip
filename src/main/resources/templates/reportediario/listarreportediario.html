<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Reporte Diario | UISRAEL</title>
<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <main class="dashboard-content">
            <div class="container-fluid px-3 px-lg-4 py-4">
                <div class="page-heading">
                    <div class="page-heading-copy">
                        <span class="page-icon"><i class="bi bi-clipboard-data"></i></span>
                        <div>
                            <p class="eyebrow mb-1">Asistencia</p>
                            <h1 class="h3 mb-1">Reporte Diario</h1>
                        </div>
                    </div>
                    <div class="page-heading-actions">
                        <a href="/reportediario/nuevo" class="btn btn-primary">
                            <i class="bi bi-plus-lg me-1"></i> Nuevo Reporte
                        </a>
                    </div>
                </div>
                <section class="panel">
                    <div class="panel-header">
                        <div>
                            <h2 class="h5 mb-1 section-title"><i class="bi bi-table"></i> Lista de Reportes Diarios</h2>
                            <p class="text-muted mb-0">Reportes diarios registrados en el sistema.</p>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>ID Empleado</th>
                                    <th>Fecha</th>
                                    <th>Hora Entrada</th>
                                    <th>Hora Salida</th>
                                    <th>Tardanza</th>
                                    <th>Min. Tardanza</th>
                                    <th>Incompleta</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="indice : ${listareportes}">
                                    <td th:text="${indice.idReporte}"></td>
                                    <td th:text="${indice.idEmpleado}"></td>
                                    <td th:text="${indice.fechaReporte}"></td>
                                    <td th:text="${indice.horaEntrada}"></td>
                                    <td th:text="${indice.horaSalida}"></td>
                                    <td>
                                        <span th:if="${indice.tardanzaReporte}" class="badge text-bg-warning">Sí</span>
                                        <span th:unless="${indice.tardanzaReporte}" class="badge text-bg-success">No</span>
                                    </td>
                                    <td th:text="${indice.minutosTardanza}"></td>
                                    <td>
                                        <span th:if="${indice.marcacionIncompleta}" class="badge text-bg-danger">Sí</span>
                                        <span th:unless="${indice.marcacionIncompleta}" class="badge text-bg-success">No</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
