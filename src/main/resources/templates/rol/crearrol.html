<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Nuevo Rol | UISRAEL</title>
<link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="admin-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <main class="dashboard-content">
            <div class="container-fluid px-3 px-lg-4 py-4">
                <div class="page-heading">
                    <div class="page-heading-copy">
                        <span class="page-icon"><i class="bi bi-shield-plus"></i></span>
                        <div>
                            <p class="eyebrow mb-1">Asistencia</p>
                            <h1 class="h3 mb-1">Nuevo Rol</h1>
                        </div>
                    </div>
                    <div class="page-heading-actions">
                        <a href="/rol" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Volver
                        </a>
                    </div>
                </div>
                <section class="panel">
                    <div class="panel-header">
                        <div>
                            <h2 class="h5 mb-1 section-title"><i class="bi bi-pencil-square"></i> Datos del Rol</h2>
                            <p class="text-muted mb-0">Complete los campos para registrar un nuevo rol.</p>
                        </div>
                    </div>
                    <div class="p-4">
                        <form th:action="@{/rol/guardar}" th:object="${rol}" method="post">
                            <div class="mb-3">
                                <label for="nombreRol" class="form-label">Nombre</label>
                                <input type="text" th:field="*{nombreRol}" class="form-control" id="nombreRol">
                            </div>
                            <div class="mb-3">
                                <label for="descripcionRol" class="form-label">Descripción</label>
                                <input type="text" th:field="*{descripcionRol}" class="form-control" id="descripcionRol">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i> Guardar
                            </button>
                            <a href="/rol" class="btn btn-outline-secondary ms-2">Cancelar</a>
                        </form>
                    </div>
                </section>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
