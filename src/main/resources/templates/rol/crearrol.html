<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Nuevo Rol | Asistencia</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-shield-lock"></i></span>
				<div>
					<p class="eyebrow mb-1">Gestión</p>
					<h1 class="h3 mb-1">Nuevo Rol</h1>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-outline-secondary btn-sm" th:href="@{/rol}"> <i
					class="bi bi-arrow-left"></i> Volver
				</a>
			</div>
		</div>
		<section class="row g-3">
			<div class="col-12 col-xl-8">
				<form class="panel" th:action="@{/rol/guardar}" th:object="${rol}"
					method="post">
					<div class="panel-header">
						<div>
							<h2 class="h5 mb-1 section-title">
								<i class="bi bi-shield-lock"></i><span>Datos del Rol</span>
							</h2>
						</div>
					</div>
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Nombre (ADMIN / SUPERVISOR /
								EMPLEADO)</label> <input class="form-control" type="text"
								th:field="*{nombreRol}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Fecha de creación</label> <input
								class="form-control" type="datetime-local"
								th:field="*{creadoRol}">
						</div>
						<div class="col-12">
							<label class="form-label">Descripción</label> <input
								class="form-control" type="text" th:field="*{descripcionRol}">
						</div>
					</div>
					<div class="d-flex justify-content-end gap-2 mt-4">
						<a class="btn btn-outline-secondary" th:href="@{/rol}">Cancelar</a>
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-check-lg"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</section>
	</div>
</body>
</html>
