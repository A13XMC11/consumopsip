<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Roles | Asistencia</title>
</head>
<body>
	<div layout:fragment="cargarpaginas">
		<div class="page-heading">
			<div class="page-heading-copy">
				<span class="page-icon"><i class="bi bi-shield-lock"></i></span>
				<div>
					<p class="eyebrow mb-1">Gestión</p>
					<h1 class="h3 mb-1">Roles</h1>
					<div th:if="${error}" class="alert alert-danger mt-2" th:text="${error}"></div>
					<p class="text-muted mb-0">Roles registrados en el sistema.</p>
				</div>
			</div>
			<div class="heading-actions">
				<a class="btn btn-primary btn-sm" th:href="@{/rol/nuevo}"> <i
					class="bi bi-plus-lg"></i> Nuevo Rol
				</a>
			</div>
		</div>
		<section class="panel mt-3">
			<div class="panel-header">
				<div>
					<h2 class="h5 mb-1 section-title">
						<i class="bi bi-table"></i><span>Lista de Roles</span>
					</h2>
				</div>
			</div>
			<div class="table-responsive">
				<table class="table align-middle mb-0">
					<thead>
						<tr>
							<th>#</th>
							<th>Nombre</th>
							<th>Descripción</th>
							<th>Creado</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="indice : ${listaroles}">
							<td th:text="${indice.idRol}"></td>
							<td th:text="${indice.nombreRol}"></td>
							<td th:text="${indice.descripcionRol}"></td>
							<td th:text="${indice.creadoRol}"></td>
							<td>
								<a th:href="@{/rol/editar/{id}(id=${indice.idRol})}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i></a>
								<a th:href="@{/rol/eliminar/{id}(id=${indice.idRol})}" class="btn btn-light btn-sm" onclick="return confirm('¿Eliminar este rol?')"><i class="bi bi-trash"></i></a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
